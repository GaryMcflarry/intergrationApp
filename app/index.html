<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>integrationApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* The widget: the player card, with a bar to drag it by, on a transparent window that fits the card. */
:root { color-scheme: dark; }
html, body { margin: 0; background: transparent; overflow: hidden; }
/* the player fills the widget (its own card, rounded, with a small margin for the window's edge) */
html .np.in-app.mini-page { top: 8px !important; left: 8px !important; right: auto !important; width: 380px !important; opacity: 1 !important; transform: none !important; }
html .np.in-app.mini-page.big { width: 420px !important; }
html .np.in-app.mini-page.big.wide { width: 780px !important; }
html .np.in-app.mini-page .np-card { border-radius: 18px !important; min-height: 0 !important; box-shadow: 0 8px 22px rgba(0, 0, 0, .45) !important; }
html .np.in-app.mini-page.big .np-more { max-height: 560px !important; }
.np-tab { display: none !important; }
/* the bar: drag the widget by it; pin (always on top), settings, minimise, close (to the tray) */
.wbar { display: flex; align-items: center; gap: 2px; padding: 8px 10px 0 14px; -webkit-app-region: drag; user-select: none; font: 600 10px/1 "Chakra Petch", "Trebuchet MS", system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: rgba(245, 243, 255, .55); }
.wbar .name { flex: 1; display: flex; align-items: center; gap: 8px; }
.wbar .dot { width: 7px; height: 7px; border-radius: 50%; background: #5a5870; transition: background .3s, box-shadow .3s; }
.wbar .dot.ok { background: #5865f2; box-shadow: 0 0 8px #5865f2; }
.np .wbar button { -webkit-app-region: no-drag; width: 26px; height: 26px; border-radius: 8px; color: rgba(245, 243, 255, .6); }
.np .wbar button:hover { color: #fff; background: rgba(255, 255, 255, .1); }
.np .wbar button[aria-pressed="true"] { color: var(--np-hi); }
.np .wbar button svg { width: 15px; height: 15px; fill: none; }
</style>
</head>
<body>
<script src="desktop.js"></script>
<script>window.YT_SETUP_URL = 'http://localhost:' + location.port + '/youtube.html';   // Google signs in on localhost</script>
<script src="ytmusic.js"></script>
<script src="nowplaying.js"></script>
<script>
(function () {
  'use strict';
  var D = window.desktop || null;
  NowPlaying.init({ id: 'app', on: true, app: true });
  var box = document.querySelector('.np');

  /* ---------- the bar, at the top of the card ---------- */
  var I = {
    pin: '<svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
    min: '<svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  var bar = document.createElement('div'); bar.className = 'wbar';
  bar.innerHTML = '<span class="name"><i class="dot" title="Discord"></i>integrationApp</span>' +
    '<button type="button" class="b-pin" title="Always on top" aria-pressed="false">' + I.pin + '</button>' +
    '<button type="button" class="b-gear" title="Settings: Discord, the app">' + I.gear + '</button>' +
    '<button type="button" class="b-min" title="Minimise">' + I.min + '</button>' +
    '<button type="button" class="b-x" title="Close to the tray">' + I.x + '</button>';
  var card = box.querySelector('.np-card'); card.insertBefore(bar, card.firstChild);
  if (!D) { bar.querySelectorAll('button').forEach(function (b) { b.hidden = true; }); return; }   // opened in a browser: just the player

  var pin = bar.querySelector('.b-pin');
  function paintSettings(s) { if (s) pin.setAttribute('aria-pressed', String(!!s.alwaysOnTop)); }
  D.settings.get().then(paintSettings); D.settings.onChange(paintSettings);
  pin.addEventListener('click', function () { D.window.setOnTop(pin.getAttribute('aria-pressed') !== 'true'); });
  bar.querySelector('.b-gear').addEventListener('click', function () { D.window.openSetup(location.origin + '/settings.html'); });
  bar.querySelector('.b-min').addEventListener('click', function () { D.window.minimize(); });
  bar.querySelector('.b-x').addEventListener('click', function () { D.window.close(); });
  var dot = bar.querySelector('.dot');
  function paintDiscord(st) { if (!st) return; dot.classList.toggle('ok', !!st.ok); dot.title = 'Discord: ' + st.text; }
  D.discord.status().then(paintDiscord); D.discord.onStatus(paintDiscord);

  /* ---------- the window follows the card's size; the full view / DJ mode covers the screen ---------- */
  var full = false, fitT = 0;
  function fit() {
    if (full) return; clearTimeout(fitT);
    fitT = setTimeout(function () { var r = box.getBoundingClientRect(); D.window.fit(Math.ceil(r.right) + 8, Math.ceil(r.bottom) + 10); }, 30);
  }
  new ResizeObserver(fit).observe(box);
  new MutationObserver(fit).observe(box, { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('np:view', function (e) { var on = !!(e.detail && e.detail.view); if (on === full) return; full = on; D.window.full(on); if (!on) setTimeout(fit, 120); });
  fit();

  /* ---------- Discord shows what plays: the source that started playing last ---------- */
  var now = { spotify: null, youtube: null }, lead = null;
  window.addEventListener('np:track', function (e) {
    var t = e.detail || {}; if (!t.source) return;
    now[t.source] = t;
    if (t.playing) lead = t.source;
    var show = lead && now[lead] && now[lead].playing ? now[lead] : (now.spotify && now.spotify.playing ? now.spotify : now.youtube && now.youtube.playing ? now.youtube : null);
    D.discord.update(show);
  });
})();
</script>
</body>
</html>
