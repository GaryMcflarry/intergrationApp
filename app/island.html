<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>integrationApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* The island: a black shape at the top of the screen that grows in four steps.
   0 pill (what plays, or Discord) · 1 peek (three tabs and what plays) · 2 expanded (the full player, or Discord's
   channels) · 3 the whole screen. Hover or click opens it, dragging down opens it further, dragging up / Esc closes. */
:root { color-scheme: dark; --ink: #f5f3ff; --ink2: rgba(245, 243, 255, .58); --edge: rgba(255, 255, 255, .09); --sp: #1ed760; --yt: #ff4e45; --dc: #5865f2; --acc: var(--sp); --spring: cubic-bezier(.2, .9, .22, 1.06); }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { color: var(--ink); font: 500 13px/1.35 "Chakra Petch", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#isl[data-tab="yt"] { --acc: var(--yt); } #isl[data-tab="dc"] { --acc: var(--dc); }

#isl { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); width: var(--w, 200px); height: var(--h, 36px); border-radius: var(--r, 18px); background: #000;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .07); overflow: hidden; z-index: 1;
  transition: width .44s var(--spring), height .44s var(--spring), border-radius .44s ease, top .3s ease; }
#isl::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 60%); }
#isl:not([data-l="0"])::before { opacity: 1; }
#isl[data-l="3"] { top: 0; left: 0; transform: none; width: 100%; height: 100%; border-radius: 0; background: radial-gradient(120% 100% at 50% 0%, #111024, #050509 70%); box-shadow: none; }
body.np-full #isl { opacity: 0; pointer-events: none; }
.lv { position: absolute; left: 0; right: 0; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.lv.on { opacity: 1; pointer-events: auto; transition-delay: .12s; }

/* 0 · the pill */
.pill { top: 0; height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 9px; cursor: pointer; }
.ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; }
.ic svg { width: 20px; height: 20px; display: block; }
.pt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; font-weight: 600; font-size: 12.5px; letter-spacing: .01em; -webkit-mask: linear-gradient(90deg, #000 85%, transparent); mask: linear-gradient(90deg, #000 85%, transparent); }
.pt span { display: inline-block; }
.pt.mq span { animation: mq var(--mqd, 12s) ease-in-out infinite alternate; }
@keyframes mq { 0%, 15% { transform: none; } 85%, 100% { transform: translateX(var(--mq, 0)); } }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.eq i { width: 3px; height: 100%; border-radius: 2px; background: var(--acc); transform-origin: bottom; transform: scaleY(.25); }
#isl.playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
#isl.playing .eq i:nth-child(2) { animation-duration: .7s; animation-delay: -.3s; } #isl.playing .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -.6s; }
@keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--dc); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-sizing: border-box; }
.badge[hidden] { display: none; }

/* 1+ · the head: three tabs, then pin, more, the whole screen, close */
.head { top: 0; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 12px; }
.tabs { flex: 1; display: flex; gap: 2px; min-width: 0; }
.tabs button { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; transition: background .2s, color .2s; }
.tabs button svg { width: 15px; height: 15px; flex: none; }
.tabs button:hover { color: #fff; }
.tabs button[aria-selected="true"] { color: #fff; background: rgba(255, 255, 255, .09); }
.tabs button:not([aria-selected="true"]) .tl { display: none; }   /* the others: just their icon */
.tabs button:not([aria-selected="true"]) { padding: 6px 8px; opacity: .75; } .tabs button:not([aria-selected="true"]):hover { opacity: 1; background: rgba(255, 255, 255, .05); }
.tabs button .tb { position: relative; }
.tabs .dotn { position: absolute; top: -3px; right: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--dc); box-shadow: 0 0 6px var(--dc); }
.tabs .dotn[hidden] { display: none; }
.hb { display: flex; gap: 2px; }
.hb button { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink2); }
.hb button:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.hb button[aria-pressed="true"] { color: var(--acc); }
.hb svg { width: 15px; height: 15px; }
#isl[data-l="2"] .h-more svg, #isl[data-l="3"] .h-more svg { transform: rotate(180deg); }
#isl[data-l="3"] .h-full { display: none; }
@media (max-width: 1px) {}

/* 1 · peek: what plays, or Discord's latest */
.peek { top: 46px; bottom: 0; padding: 4px 16px 14px; }
.now { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.art { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; background: #1a1a24; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); cursor: pointer; }
.nt { min-width: 0; display: grid; gap: 2px; }
.nt b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nt span { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nbar { margin-top: 8px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.nbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, transparent, var(--acc)); box-shadow: 0 0 8px var(--acc); }
.ntime { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink2); margin-top: 4px; font-variant-numeric: tabular-nums; }
.ctl { display: flex; align-items: center; gap: 2px; }
.ctl button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background .2s, transform .12s; }
.ctl button:hover { background: rgba(255, 255, 255, .1); }
.ctl button:active { transform: scale(.92); }
.ctl svg { width: 18px; height: 18px; fill: currentColor; }
.ctl .c-play { width: 42px; height: 42px; background: #f5f3ff; color: #000; }
.ctl .c-play:hover { background: #fff; }
.ctl .c-like.on { color: var(--acc); }
.ctl .c-like svg { fill: none; }
.ctl .c-like.on svg { fill: currentColor; }
.empty { display: grid; gap: 10px; justify-items: start; padding: 6px 2px; color: var(--ink2); }
.empty b { color: var(--ink); font-size: 14px; }
.go { display: inline-flex; gap: 7px; align-items: center; padding: 8px 14px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 60%, transparent); background: color-mix(in srgb, var(--acc) 14%, transparent); }
.go:hover { background: color-mix(in srgb, var(--acc) 26%, transparent); }
.dcline { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 11.5px; margin-bottom: 8px; }
.dcline i { width: 7px; height: 7px; border-radius: 50%; background: #5a5870; flex: none; }
.dcline i.ok { background: var(--dc); box-shadow: 0 0 8px var(--dc); }

/* Discord messages (peek, expanded, the whole screen) */
.msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 6px 6px; border-radius: 10px; cursor: pointer; }
.msg:hover { background: rgba(255, 255, 255, .05); }
.msg img { width: 32px; height: 32px; border-radius: 50%; background: #2a2a3a; }
.msg .mh { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.msg .mh b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg .mh small { color: var(--ink2); font-size: 11px; white-space: nowrap; }
.msg p { margin: 1px 0 0; color: rgba(245, 243, 255, .85); word-wrap: break-word; white-space: pre-wrap; user-select: text; }
.peek .msg p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dcp { top: 46px; bottom: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding: 2px 14px 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { padding: 5px 11px; border-radius: 999px; font-size: 11.5px; color: var(--ink2); box-shadow: inset 0 0 0 1px var(--edge); }
.chips button[aria-pressed="true"] { color: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dc) 70%, transparent); background: color-mix(in srgb, var(--dc) 18%, transparent); }
.dcp .msgs { overflow-y: auto; scrollbar-width: thin; align-content: start; }
.dcfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink2); font-size: 11.5px; }
.dcfoot a, .dcfoot button { color: #aab0ff; text-decoration: none; font-weight: 700; }
#isl[data-l="3"] .dcp { top: 70px; width: min(980px, calc(100% - 64px)); margin: 0 auto; padding-bottom: 40px; }
#isl[data-l="3"] .head { height: 64px; width: min(980px, calc(100% - 64px)); margin: 0 auto; padding: 8px 0 0; }
#isl[data-l="3"] .msg { grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 10px; }
#isl[data-l="3"] .msg img { width: 44px; height: 44px; }
#isl[data-l="3"] .msg .mh b { font-size: 16px; }
#isl[data-l="3"] .msg p { font-size: 15px; }

/* the grab bar: drag down for more, up for less */
.grab { position: absolute; left: 50%; bottom: 4px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(255, 255, 255, .16); opacity: 0; transition: opacity .3s; cursor: ns-resize; }
#isl[data-l="1"] .grab, #isl[data-l="2"] .grab { opacity: 1; }

/* the player (Spotify / YouTube Music) inside the island when expanded */
html .np.in-app.mini-page { top: 52px !important; left: 50% !important; right: auto !important; width: 420px !important; opacity: 1 !important; transform: translateX(-50%) !important; z-index: 5; transition: none !important; }
html .np.in-app.mini-page.big.wide { width: 780px !important; }
html .np.in-app.mini-page .np-card { background: transparent !important; border: 0 !important; box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; min-height: 0 !important; border-radius: 0 !important; }
html .np.in-app .np-card::before { display: none; }
html .np.in-app.mini-page.big .np-more { max-height: 540px !important; }
.np.in-app .np-src { display: none !important; }
.np-tab { display: none !important; }
body:not(.show-np) .np { visibility: hidden !important; pointer-events: none !important; }
body:not(.show-np) .np * { visibility: hidden !important; }
.np-dj { background-color: #05050b; }   /* the whole screen covers the wallpaper */
@media (prefers-reduced-motion: reduce) { #isl { transition: none; } .pt.mq span, #isl.playing .eq i { animation: none; } }
</style>
</head>
<body>
<div id="isl" data-l="0" data-tab="sp" role="region" aria-label="integrationApp">
  <div class="lv pill on" title="Hover, click or drag down to open">
    <span class="ic"></span><span class="pt"><span class="ptx">integrationApp</span></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><b class="badge" hidden></b>
  </div>
  <div class="lv head">
    <div class="tabs" role="tablist" aria-label="Integrations">
      <button type="button" role="tab" data-t="sp" title="Spotify"><span class="tb ics"></span><span class="tl">Spotify</span></button>
      <button type="button" role="tab" data-t="yt" title="YouTube Music"><span class="tb icy"></span><span class="tl">YouTube Music</span></button>
      <button type="button" role="tab" data-t="dc" title="Discord"><span class="tb icd"><i class="dotn" hidden></i></span><span class="tl">Discord</span></button>
    </div>
    <div class="hb">
      <button type="button" class="h-pin" title="Keep it open" aria-pressed="false"></button>
      <button type="button" class="h-more" title="More"></button>
      <button type="button" class="h-full" title="Cover the screen"></button>
      <button type="button" class="h-up" title="Close it to the pill"></button>
    </div>
  </div>
  <div class="lv peek"></div>
  <div class="lv dcp">
    <div class="chips"></div>
    <ul class="msgs"></ul>
    <div class="dcfoot"><span class="dcst"></span><span><button type="button" class="dc-refresh">Refresh</button> · <button type="button" class="dc-setup">Set up ↗</button></span></div>
  </div>
  <span class="grab" aria-hidden="true"></span>
</div>
<script src="desktop.js"></script>
<script>window.NP_SETUP_URL = location.origin + '/guide/spotify.html'; window.YT_SETUP_URL = 'http://localhost:' + location.port + '/guide/youtube.html';</script>
<script src="ytmusic.js"></script>
<script src="nowplaying.js"></script>
<script>
(function () {
  'use strict';
  var D = window.desktop || null;
  var api = NowPlaying.init({ id: 'island', on: true, app: true });
  var isl = document.getElementById('isl'), body = document.body;
  function $(c) { return isl.querySelector(c); }
  function $$(c) { return Array.prototype.slice.call(isl.querySelectorAll(c)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(ms) { ms = Math.max(0, ms | 0); var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function ago(ts) { var m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'now' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' d'; }
  function guide(what) { if (D) D.openGuide(what); else window.open(location.origin + '/guide/' + (what === 'index' ? '' : what + '.html'), '_blank'); }

  /* ---------- icons ---------- */
  var IC = {
    sp: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1ed760"/><path d="M6.5 9.3c3.8-1.2 8-.9 11.2 1M7.2 12.4c3.1-.9 6.4-.6 9 .9M7.9 15.3c2.4-.7 4.8-.5 6.8.7" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"/></svg>',
    yt: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ff4e45"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M10.6 9.6v4.8l4-2.4z" fill="#fff"/></svg>',
    dc: '<svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="7" fill="#5865f2"/><path d="M8.3 7.6c1.2-.5 2.4-.7 3.7-.7s2.5.2 3.7.7c1.2 1.7 1.8 3.6 1.7 5.7-1.1.9-2.3 1.4-3.6 1.7l-.7-1.1c.6-.2 1.1-.5 1.6-.8-2 .9-3.8.9-5.4 0 .5.3 1 .6 1.6.8l-.7 1.1c-1.3-.3-2.5-.8-3.6-1.7-.1-2.1.5-4 1.7-5.7z" fill="#fff"/><circle cx="10" cy="11.4" r="1" fill="#5865f2"/><circle cx="14" cy="11.4" r="1" fill="#5865f2"/></svg>',
    app: '<svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ed760"/><stop offset=".5" stop-color="#5865f2"/><stop offset="1" stop-color="#ff4e45"/></linearGradient></defs><circle cx="12" cy="12" r="9" fill="url(#g)"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    more: '<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    full: '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    up: '<svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    prev: '<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    ext: '<svg viewBox="0 0 24 24" width="13" height="13"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  $('.ics').innerHTML = IC.sp; $('.icy').innerHTML = IC.yt; $('.icd').insertAdjacentHTML('afterbegin', IC.dc);
  $('.h-pin').innerHTML = IC.pin; $('.h-more').innerHTML = IC.more; $('.h-full').innerHTML = IC.full; $('.h-up').innerHTML = IC.up;

  /* ---------- state ---------- */
  var level = 0, tab = 'sp', sticky = false, pinned = false;
  try { pinned = localStorage.getItem('ia-pin') === '1'; } catch (e) { }
  var music = { spotify: null, youtube: null }, lead = null, feed = { configured: false, messages: [], channels: [] }, dcStatus = { text: '', ok: false }, dcChan = 'all';
  var settings = {};
  var seen = 0; try { seen = +localStorage.getItem('ia-dc-seen') || 0; } catch (e) { }
  var SRC = { sp: 'spotify', yt: 'youtube' };

  /* ---------- what plays: the player tells; Discord shows the one that started playing last ---------- */
  window.addEventListener('np:track', function (e) {
    var t = e.detail || {}; if (!t.source) return;
    music[t.source] = t.title ? t : null; if (t.playing) lead = t.source;
    if (D) D.discord.update(leading());
    paintPill(); if (level === 1) paintPeek();
  });
  function leading() {
    var m = lead && music[lead] && music[lead].playing ? music[lead] : music.spotify && music.spotify.playing ? music.spotify : music.youtube && music.youtube.playing ? music.youtube : null;
    return m;
  }
  function shown() { return leading() || (lead && music[lead]) || music.spotify || music.youtube; }   // playing, else the last one paused
  function dcSetUp() { return !!(feed.configured || settings.discordId || settings.bot); }
  function unread() { return feed.messages.filter(function (m) { return m.ts > seen; }).length; }

  /* ---------- 0 · the pill ---------- */
  function paintPill() {
    var m = shown(), u = unread(), kind, text;
    if (m && (m.playing || !dcSetUp() || !u)) { kind = m.source === 'youtube' ? 'yt' : 'sp'; text = m.title + (m.artist ? ' · ' + m.artist : ''); }
    else if (dcSetUp()) { kind = 'dc'; text = u ? u + ' new message' + (u > 1 ? 's' : '') : 'Discord'; }
    else { kind = 'app'; text = 'integrationApp'; }
    isl.classList.toggle('playing', !!(m && m.playing));
    $('.pill .ic').innerHTML = IC[kind] || IC.app;
    $('.badge').hidden = !(kind !== 'dc' && u); $('.badge').textContent = u > 9 ? '9+' : String(u);
    $('.dotn').hidden = !u;
    var pt = $('.pt'), sp = $('.ptx');
    if (sp.textContent !== text) { sp.textContent = text; pt.classList.remove('mq'); }
    isl.dataset.kind = kind;
    if (level === 0) size();
  }
  var measure = document.createElement('canvas').getContext('2d');
  function pillWidth() {
    measure.font = '600 12.5px "Chakra Petch", "Segoe UI", system-ui, sans-serif';
    var w = measure.measureText($('.ptx').textContent).width;
    return Math.round(Math.max(170, Math.min(340, 9 + 20 + 9 + w + 12 + 14 + 14 + ($('.badge').hidden ? 0 : 26))));
  }
  function marquee() {
    var pt = $('.pt'), sp = $('.ptx'), d = sp.scrollWidth - pt.clientWidth;
    if (d > 4 && level === 0) { pt.style.setProperty('--mq', -(d + 18) + 'px'); pt.style.setProperty('--mqd', Math.max(6, (d + 18) / 20 + 4).toFixed(1) + 's'); pt.classList.add('mq'); }
    else pt.classList.remove('mq');
  }

  /* ---------- 1 · peek ---------- */
  function ctlRow(src, t) {
    var c = el('div', 'ctl');
    function b(cls, icon, title, fn) { var x = el('button', cls); x.type = 'button'; x.innerHTML = icon; x.title = title; x.setAttribute('aria-label', title); x.addEventListener('click', fn); c.appendChild(x); return x; }
    if (src === 'sp') { var lk = b('c-like' + (api.liked() ? ' on' : ''), IC.heart, 'Like', function () { api.like(); setTimeout(paintPeek, 250); }); }
    b('c-prev', IC.prev, 'Previous', function () { api.control(src, 'prev'); });
    b('c-play', t && t.playing ? IC.pause : IC.play, t && t.playing ? 'Pause' : 'Play', function () { api.control(src, 'play'); });
    b('c-next', IC.next, 'Next', function () { api.control(src, 'next'); });
    return c;
  }
  function emptyBox(title, line, btn, fn) {
    var e = el('div', 'empty'); e.appendChild(el('b', null, title)); if (line) e.appendChild(el('span', null, line));
    if (btn) { var g = el('button', 'go'); g.type = 'button'; g.innerHTML = btn; g.addEventListener('click', fn); e.appendChild(g); }
    return e;
  }
  function paintPeek() {
    var p = $('.peek'); p.textContent = '';
    if (tab === 'dc') return paintPeekDiscord(p);
    var t = music[SRC[tab]];
    if (tab === 'sp' && !api.signedIn()) { p.appendChild(emptyBox('Spotify is not connected yet', 'Connect it once in your browser: the guide walks you through it.', 'Set up Spotify ' + IC.ext, function () { guide('spotify'); })); return; }
    if (!t) {
      var ytLib = window.YTMusic && YTMusic.library();
      if (tab === 'yt' && !ytLib) { p.appendChild(emptyBox('YouTube Music is not set up yet', 'Sign in once in your browser to bring in your playlists and likes.', 'Set up YouTube Music ' + IC.ext, function () { guide('youtube'); })); return; }
      p.appendChild(emptyBox('Nothing playing on ' + (tab === 'sp' ? 'Spotify' : 'YouTube Music'), tab === 'sp' ? 'Play something on any of your devices, or pick something here.' : 'Pick a mix or one of your playlists.', 'Open the player', function () { go(2); }));
      return;
    }
    var n = el('div', 'now'), art = el('img', 'art'); art.alt = ''; if (t.art) art.src = t.art; art.title = 'Cover the screen'; art.addEventListener('click', function () { go(3); });
    var tx = el('div', 'nt'); tx.appendChild(el('b', null, t.title)); tx.appendChild(el('span', null, t.artist || (tab === 'yt' ? 'YouTube Music' : '')));
    var bar = el('div', 'nbar'); bar.appendChild(el('i')); tx.appendChild(bar);
    var tm = el('div', 'ntime'); tm.appendChild(el('span', 'tcur', '0:00')); tm.appendChild(el('span', null, fmt(t.duration))); tx.appendChild(tm);
    n.appendChild(art); n.appendChild(tx); n.appendChild(ctlRow(tab, t)); p.appendChild(n);
    tickPeek();
  }
  function tickPeek() {
    if (level !== 1 || tab === 'dc') return; var t = music[SRC[tab]], i = $('.peek .nbar i'); if (!t || !i) return;
    var pos = t.playing ? Date.now() - t.start : (t.pausedAt || (t.pausedAt = Date.now() - t.start, t.pausedAt));
    pos = Math.max(0, Math.min(t.duration || 0, pos));
    i.style.width = t.duration ? (pos / t.duration * 100).toFixed(2) + '%' : '0'; var c = $('.peek .tcur'); if (c) c.textContent = fmt(pos);
  }
  setInterval(tickPeek, 500);
  function msgRow(m, short) {
    var li = el('li', 'msg'), im = el('img'); im.alt = ''; im.loading = 'lazy'; if (m.author.avatar) im.src = m.author.avatar; im.onerror = function () { this.removeAttribute('src'); };
    var b = el('div'), h = el('div', 'mh'); h.appendChild(el('b', null, m.author.name)); h.appendChild(el('small', null, '#' + m.channelName + ' · ' + ago(m.ts)));
    b.appendChild(h); b.appendChild(el('p', null, m.content || '')); li.appendChild(im); li.appendChild(b);
    li.title = 'Open in Discord'; li.addEventListener('click', function () { window.open(m.url, '_blank'); });
    return li;
  }
  function dcLine() {
    var l = el('div', 'dcline'), i = el('i'); if (dcStatus.ok) i.className = 'ok'; l.appendChild(i);
    var m = leading();
    l.appendChild(el('span', null, dcStatus.ok ? (m ? 'Showing “' + m.title + '” on your profile' : 'Connected: nothing playing to show') : (dcStatus.text || 'Rich Presence is off')));
    return l;
  }
  function paintPeekDiscord(p) {
    if (!dcSetUp()) { p.appendChild(emptyBox('Discord is not set up yet', 'Show what you play on your profile, and see the latest messages from your servers.', 'Set up Discord ' + IC.ext, function () { guide('discord'); })); return; }
    p.appendChild(dcLine());
    var ul = el('ul', 'msgs');
    if (!feed.configured) p.appendChild(emptyBox('', 'Add a bot in the guide to see messages here.', 'Add messages ' + IC.ext, function () { guide('discord'); }));
    else if (feed.error && !feed.messages.length) p.appendChild(emptyBox('', feed.error, 'Fix it in the guide ' + IC.ext, function () { guide('discord'); }));
    else if (!feed.messages.length) p.appendChild(el('div', 'empty', feed.channels.length ? 'No messages yet.' : 'Pick channels to follow in the guide.'));
    else { feed.messages.slice(0, 2).forEach(function (m) { ul.appendChild(msgRow(m, true)); }); p.appendChild(ul); }
    markSeen();
  }

  /* ---------- 2 / 3 · Discord's channels ---------- */
  function paintDiscord() {
    var chips = $('.dcp .chips'), ul = $('.dcp .msgs'); chips.textContent = ''; ul.textContent = '';
    [{ id: 'all', name: 'All' }].concat(feed.channels.map(function (c) { return { id: c.id, name: '#' + c.name }; })).forEach(function (c) {
      var b = el('button', null, c.name); b.type = 'button'; b.setAttribute('aria-pressed', String(dcChan === c.id)); b.addEventListener('click', function () { dcChan = c.id; paintDiscord(); }); chips.appendChild(b);
    });
    if (!dcSetUp() || !feed.configured) { ul.appendChild(emptyBox(dcSetUp() ? 'No messages yet' : 'Discord is not set up yet', 'A bot of yours, added to your server, brings in the latest messages from the channels you pick.', 'Open the guide ' + IC.ext, function () { guide('discord'); })); }
    else {
      var ms = feed.messages.filter(function (m) { return dcChan === 'all' || m.channel === dcChan; });
      if (!ms.length) ul.appendChild(el('div', 'empty', feed.error || 'Nothing here yet.'));
      ms.forEach(function (m) { ul.appendChild(msgRow(m)); });
    }
    $('.dcst').textContent = (dcStatus.ok ? '● ' : '○ ') + (dcStatus.text || 'Rich Presence is off') + (feed.bot ? ' · bot: ' + feed.bot : '');
    markSeen();
  }
  $('.dc-refresh').addEventListener('click', function () { if (D) D.discord.refresh(); });
  $('.dc-setup').addEventListener('click', function () { guide('discord'); });
  function markSeen() {
    if (tab !== 'dc' || level === 0 || !feed.messages.length) return;
    var top = feed.messages[0].ts; if (top > seen) { seen = top; try { localStorage.setItem('ia-dc-seen', String(seen)); } catch (e) { } paintPill(); }
  }

  /* ---------- the levels, and the window's size ---------- */
  var HEAD = 46, curW = 0, curH = 0, shrinkT = 0;
  function target() {
    if (level === 0) return [pillWidth(), 36, 18];
    if (level === 1) return [tab === 'dc' ? 460 : 440, tab === 'dc' ? 214 : 186, 30];
    if (level === 2 && tab !== 'dc') { var r = document.querySelector('.np').getBoundingClientRect(); return [Math.max(440, Math.round(r.width) + 20), Math.round(HEAD + r.height + 14), 28]; }
    if (level === 2) return [480, Math.min(620, HEAD + 70 + Math.max(160, Math.min(9, feed.messages.length || 3) * 56)), 28];
    return [window.innerWidth, window.innerHeight, 0];
  }
  function size() {
    if (level === 3) return;
    var t = target(), w = t[0], h = t[1];
    isl.style.setProperty('--w', w + 'px'); isl.style.setProperty('--h', h + 'px'); isl.style.setProperty('--r', t[2] + 'px');
    var ww = w + 44, wh = h + 30;
    clearTimeout(shrinkT);
    if (!D) return;
    if (ww >= curW && wh >= curH) { D.island.size(ww, wh); curW = ww; curH = wh; }
    else {   // growing at once; shrinking after the island has (so its corners are not cut)
      D.island.size(Math.max(ww, curW), Math.max(wh, curH));
      shrinkT = setTimeout(function () { D.island.size(ww, wh); curW = ww; curH = wh; }, 470);
    }
    if (level === 0) setTimeout(marquee, 480);
  }
  function render() {
    isl.dataset.l = String(level); isl.dataset.tab = tab;
    $$('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.t === tab)); });
    $('.h-pin').setAttribute('aria-pressed', String(pinned));
    $('.pill').classList.toggle('on', level === 0);
    $('.head').classList.toggle('on', level >= 1);
    $('.peek').classList.toggle('on', level === 1);
    $('.dcp').classList.toggle('on', level >= 2 && tab === 'dc');
    var np = level === 2 && tab !== 'dc';
    body.classList.toggle('show-np', np);
    if (np) { api.setSource(tab); api.setBig(true); }
    if (level === 1) paintPeek();
    if (level >= 2 && tab === 'dc') paintDiscord();
    size();
    if (np) requestAnimationFrame(function () { requestAnimationFrame(size); });
  }
  function go(l) {
    l = Math.max(0, Math.min(3, l));
    if (l === 3) {
      if (tab === 'dc') { level = 3; if (D) D.island.full(true); render(); setTimeout(paintDiscord, 50); return; }
      var t = music[SRC[tab]];
      api.setSource(tab); api.openView(tab === 'yt' ? 'yt' : (t ? 'now' : 'dj'));   // the player's full view (DJ mode if nothing plays)
      return;
    }
    if (level === 3) { if (api.view()) { api.closeView(); return; } if (D) D.island.full(false); }
    if (l > 0 && level === 0 && !music[SRC[tab]] && tab !== 'dc') { var k = isl.dataset.kind; if (k === 'sp' || k === 'yt' || k === 'dc') tab = k; }
    level = l; render();
  }
  // the player's full view (and DJ mode) takes the whole screen
  var viewClosed = 0;
  window.addEventListener('np:view', function (e) {
    var v = e.detail && e.detail.view;
    if (v) { level = 3; body.classList.add('np-full'); if (D) D.island.full(true); render(); }
    else if (body.classList.contains('np-full')) { body.classList.remove('np-full'); viewClosed = Date.now(); if (D) D.island.full(false); level = 2; render(); }
  });
  new ResizeObserver(function () { if (level === 2 && tab !== 'dc') size(); }).observe(document.querySelector('.np'));

  /* ---------- opening and closing: hover, click, drag, the buttons, Esc, clicking elsewhere ---------- */
  var hoverT = 0, leaveT = 0, hoverOpened = false;
  isl.addEventListener('mouseenter', function () {
    clearTimeout(leaveT);
    if (level === 0) hoverT = setTimeout(function () { hoverOpened = true; sticky = false; go(1); }, 280);
  });
  document.documentElement.addEventListener('mouseleave', function () {
    clearTimeout(hoverT);
    if (level === 1 && hoverOpened && !sticky && !pinned) leaveT = setTimeout(function () { go(0); }, 650);
  });
  $('.pill').addEventListener('click', function () { clearTimeout(hoverT); sticky = true; hoverOpened = false; if (D) D.island.focus(); go(1); });
  $$('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { sticky = true; tab = b.dataset.t; if (level === 3) { go(2); } render(); });
  });
  $('.h-pin').addEventListener('click', function () { pinned = !pinned; try { localStorage.setItem('ia-pin', pinned ? '1' : '0'); } catch (e) { } render(); });
  $('.h-more').addEventListener('click', function () { sticky = true; go(level >= 2 ? 1 : 2); });
  $('.h-full').addEventListener('click', function () { go(3); });
  $('.h-up').addEventListener('click', function () { sticky = false; go(0); });
  // drag: down for more, up for less (from the pill, the head or the grab bar)
  var dragY = null;
  function dragStart(e) { if (e.button !== 0 || e.target.closest('button') && !e.target.closest('.pill')) return; dragY = e.clientY; }
  [$('.pill'), $('.head'), $('.grab')].forEach(function (n) { n.addEventListener('pointerdown', dragStart); });
  window.addEventListener('pointermove', function (e) {
    if (dragY == null) return; var dy = e.clientY - dragY;
    if (dy > 26 && level < 2) { dragY = e.clientY; sticky = true; clearTimeout(hoverT); go(level + 1); }
    else if (dy < -26 && level > 0 && level < 3) { dragY = e.clientY; go(level - 1); }
  });
  window.addEventListener('pointerup', function () { dragY = null; });
  window.addEventListener('wheel', function (e) { if (level === 0 && e.deltaY > 20) { sticky = true; go(1); } }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || document.querySelector('.np-pick.on') || Date.now() - viewClosed < 100) return;
    if (level === 3 && tab === 'dc') go(2); else if (level > 0 && level < 3) go(level - 1);
  });
  window.addEventListener('blur', function () { setTimeout(function () { if (!pinned && level > 0 && level < 3 && !document.hasFocus()) { sticky = false; go(0); } }, 180); });

  /* ---------- the app: settings, Discord ---------- */
  if (D) {
    D.settings.get().then(function (s) { settings = s || {}; paintPill(); });
    D.settings.onChange(function (s) { settings = s || {}; paintPill(); if (level === 1) paintPeek(); });
    D.discord.status().then(function (s) { dcStatus = s || dcStatus; });
    D.discord.onStatus(function (s) { dcStatus = s || dcStatus; if (tab === 'dc' && level >= 1) (level === 1 ? paintPeek : paintDiscord)(); });
    D.discord.feed().then(function (f) { if (f) { feed = f; paintPill(); } });
    D.discord.onFeed(function (f) { feed = f || feed; paintPill(); if (tab === 'dc') { if (level === 1) paintPeek(); else if (level >= 2) { paintDiscord(); size(); } } });
    D.island.onReflow(function () { curW = curH = 0; size(); });
    D.island.onPoke(function () { sticky = true; go(level === 0 ? 1 : level); });
    D.kv.onChange(function (d) { if (d.key === 'np-spotify-v1' || d.key === 'yt-library-v1') { paintPill(); if (level === 1) paintPeek(); } });
  }
  paintPill(); render();
})();
</script>
</body>
</html>
