<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Astrum: a compact black island at the top of the screen that grows in four steps.
   0 pill (what plays, or Discord) · 1 peek (three tabs and what plays) · 2 expanded (the full player, Discord's
   channels, or the settings) · 3 the whole screen. Hover or click opens it, dragging down opens it further, dragging up / Esc closes.
   The desktop window fits the active panel. */
@property --acc { syntax: '<color>'; inherits: true; initial-value: #1ed760; }
:root { color-scheme: dark; --acc: #1ed760; --glow: .25; --ink: #f5f3ff; --ink2: rgba(245, 243, 255, .65); --edge: rgba(255, 255, 255, .09);
  --sp: #1ed760; --yt: #ff4e45; --dc: #5865f2; --ease: cubic-bezier(.22, 1, .36, 1); --full-opacity: .70;
  --yt-header: 44px; --yt-grab: 16px; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { color: var(--ink); font: 500 13px/1.35 "Chakra Petch", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 3px; } ::-webkit-scrollbar-track { background: transparent; }

#isl { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); width: var(--w, 200px); height: var(--h, 36px); border-radius: var(--r, 18px);
  background: #08080c; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 8px 24px rgba(0, 0, 0, .5);
  overflow: hidden; z-index: 1; transition: width .26s var(--ease), height .26s var(--ease), border-radius .26s ease; }
#isl[data-l="3"] { top: 0; left: 0; transform: none; width: 100%; height: 100%; border-radius: 0; background: rgb(5 5 11 / var(--full-opacity)); box-shadow: none; }
body.np-full #isl, body.np-full .aura { opacity: 0; pointer-events: none; }
/* placed in the bottom half of a screen, the island sits at the bottom of its window and opens upwards (main.js) */
body.up #isl, body.up .aura { top: auto; bottom: 24px; }
body.up #isl[data-l="3"] { top: 0; bottom: 0; }
/* the overlay (Windows, macOS): the window keeps its size and the island moves and grows inside it, from where main.js
   puts the pill (--ix, --iy); everything is CSS, so it is smooth. Its empty parts let clicks through to the desktop. */
body.ov #isl, body.ov .aura { top: var(--iy, 6px); left: var(--ix, 0px); bottom: auto; transform: none;
  transition: width .32s var(--ease), height .32s var(--ease), border-radius .32s var(--ease), left .32s var(--ease), top .32s var(--ease), opacity .26s ease; }
body.ov #isl[data-l="3"] { top: 0; left: 0; }
body.ov .np.in-app.mini-page { top: calc(var(--iy, 6px) + 46px) !important; left: calc(var(--ix, 0px) + var(--w, 440px) / 2) !important; }
body.noanim #isl, body.noanim .aura { transition: none !important; }
/* macOS > In the menu bar: the island hangs from the top of the screen like the notch grown wider; closed it is the menu
   bar's height and black like the notch, with the icon on one side of it and the bars and grip on the other */
body.notch #isl:not([data-l="3"]) { border-top-left-radius: 0; border-top-right-radius: 0; }
body.notch #isl[data-l="0"] { height: max(var(--bar, 24px), 32px) !important; background: #000 !important; box-shadow: 0 6px 18px rgba(0, 0, 0, .3) !important;
  backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
body.notch #isl[data-l="0"]::after, body.notch .aura { display: none; }
body.notch .pill { height: max(var(--bar, 24px), 32px); padding: 0 16px 0 14px; }
body.notch .pill .pt, body.notch .pill .idle { visibility: hidden; }
#isl, .aura { will-change: width, height, left, top; }
/* glass: a frosted, see-through island with light catching its edges (Settings › Island › Glass) */
html.glass #isl:not([data-l="3"]) {
  background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .045) 34%, rgba(255, 255, 255, 0) 68%),
    radial-gradient(130% 120% at 50% -25%, color-mix(in srgb, var(--acc) 12%, transparent), transparent 62%),
    rgb(13 13 21 / var(--glass-a, .6));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 0 0 1px rgba(255, 255, 255, .13), inset 0 -1px 0 rgba(255, 255, 255, .06),
    inset 0 -20px 34px rgba(0, 0, 0, .16), 0 12px 34px rgba(0, 0, 0, .34);
  backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
html.glass #isl:not([data-l="3"])::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
  background: linear-gradient(112deg, transparent 28%, rgba(255, 255, 255, .07) 42%, rgba(255, 255, 255, .02) 52%, transparent 62%); }
html.glass .np.in-app .np-item:hover, html.glass .np.in-app .np-q { background: rgba(255, 255, 255, .07); }

/* the aura: a soft glow of the accent around the island that breathes (a little faster while music plays) */
.aura { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); width: var(--w, 200px); height: var(--h, 36px); border-radius: var(--r, 18px); pointer-events: none; z-index: 0;
  opacity: calc(.08 + .8 * var(--glow)); transition: width .26s var(--ease), height .26s var(--ease), border-radius .26s var(--ease), opacity .26s ease; }
.aura::before, .aura::after { content: ""; position: absolute; inset: 0; border-radius: inherit; will-change: opacity; }
.aura::before { box-shadow: 0 0 calc(5px + 10px * var(--glow)) 0 color-mix(in srgb, var(--acc) 50%, transparent); animation: aura 4s ease-in-out infinite; }
.aura::after { box-shadow: 0 0 calc(16px + 20px * var(--glow)) calc(1px + 3px * var(--glow)) color-mix(in srgb, var(--acc) 20%, transparent); animation: aura 4s ease-in-out -2s infinite; }
#isl.playing ~ .aura::before, #isl.playing ~ .aura::after { animation-duration: 2.8s; }
#isl[data-l="3"] ~ .aura, .no-aura .aura { opacity: 0; }
@keyframes aura { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

/* the grip: drag it to move Astrum, onto another screen too (the pill's far right; beside the close button when open) */
.grip { position: relative; flex: none; width: 12px; height: 20px; cursor: grab; touch-action: none; color: rgba(245, 243, 255, .42); transition: color .2s; }
.grip::before { content: ""; position: absolute; left: 50%; top: 50%; width: 2px; height: 2px; margin: -6px 0 0 -3px; border-radius: 50%; background: currentColor;   /* two columns of three dots */
  box-shadow: 4px 0 currentColor, 0 5px currentColor, 4px 5px currentColor, 0 10px currentColor, 4px 10px currentColor; }
.grip:hover, body.moving .grip { color: #fff; }
body.moving, body.moving * { cursor: grabbing !important; }
.hb .h-grip { width: 22px; }

/* the optional constellation behind the open island (Settings › Background effects) */
.sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .8s ease; }
#isl:not([data-l="0"]) .sky.on { opacity: .5; }

.lv { position: absolute; left: 50%; width: var(--cw, 100%); box-sizing: border-box; visibility: hidden; opacity: 0; pointer-events: none; transform: translateX(-50%); }
.lv.on { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .15s ease; }
#isl[data-l="3"] .lv { width: 100%; }

/* 0 · the pill */
.pill { width: var(--pw, 170px); top: 0; height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 14px 0 9px; cursor: pointer; }
.ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; color: var(--acc); }
.ic svg { width: 20px; height: 20px; display: block; overflow: visible; }
.ic .star { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--acc) 70%, transparent)); }
.pt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; font-weight: 600; font-size: 12.5px; letter-spacing: .01em; -webkit-mask: linear-gradient(90deg, #000 85%, transparent); mask: linear-gradient(90deg, #000 85%, transparent); }
.pt span { display: inline-block; }
.pt.mq span { animation: mq var(--mqd, 12s) ease-in-out infinite alternate; }
@keyframes mq { 0%, 15% { transform: none; } 85%, 100% { transform: translateX(var(--mq, 0)); } }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.eq i { width: 3px; height: 100%; border-radius: 2px; background: var(--acc); transform-origin: bottom; transform: scaleY(.25); transition: transform .4s ease; }
#isl.playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
#isl.playing .eq i:nth-child(2) { animation-duration: .7s; animation-delay: -.3s; } #isl.playing .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -.6s; } #isl.playing .eq i:nth-child(4) { animation-duration: .8s; animation-delay: -.45s; }
@keyframes eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--dc); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-sizing: border-box; }
.badge[hidden] { display: none; }
/* nothing playing: six dots light up in turn; now and then each one opens into a letter of "astrum" */
.idle { display: none; flex: 1; align-items: center; gap: 1px; height: 20px; }
#isl[data-kind="app"] .eq, .idle-motion #isl[data-kind="app"] .pt { display: none; }
.idle-motion #isl[data-kind="app"] .idle { display: flex; }
.idle .ch { position: relative; width: 13px; height: 20px; display: grid; place-items: center; }
.idle .ch i { width: 4px; height: 4px; border-radius: 50%; background: color-mix(in srgb, var(--acc) 22%, transparent); transition: transform .45s var(--ease), opacity .3s ease; transition-delay: calc(var(--i) * .06s);
  animation: dot 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .16s); }
@keyframes dot { 0%, 45%, 100% { background: color-mix(in srgb, var(--acc) 22%, transparent); box-shadow: none; } 15% { background: var(--acc); box-shadow: 0 0 6px var(--acc); } }
.idle .ch b { position: absolute; font-weight: 600; font-size: 13px; letter-spacing: 0; color: var(--ink); opacity: 0; filter: blur(4px); transform: translateY(2px) scale(.8);
  transition: opacity .45s ease, filter .45s ease, transform .55s var(--ease); transition-delay: calc(var(--i) * .07s); }
.idle.word-on .ch i { opacity: 0; transform: scale(0); }
.idle.word-on .ch b { opacity: 1; filter: none; transform: none; }

/* 1+ · the three apps and the window controls */
.head { top: 0; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 12px; }
.tabs { flex: 1; display: flex; gap: 2px; min-width: 0; }
.tabs button { display: inline-flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--ink2); white-space: nowrap; transition: background .2s, color .2s; }
.tabs button svg { width: 15px; height: 15px; flex: none; }
.tabs button:hover { color: #fff; }
.tabs button[aria-selected="true"] { color: #fff; background: rgba(255, 255, 255, .09); }
.tabs button:not([aria-selected="true"]) .tl { display: none; }
.tabs button:not([aria-selected="true"]):hover { background: rgba(255, 255, 255, .05); }
.tabs button .tb { position: relative; display: grid; }
.tabs .dotn { position: absolute; top: -3px; right: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--dc); box-shadow: 0 0 6px var(--dc); }
.tabs .dotn[hidden] { display: none; }
.hb { display: flex; gap: 2px; }
.hb button { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--ink2); transition: color .2s, background .2s; }
.hb button:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.hb button[aria-pressed="true"] { color: var(--acc); }
.hb svg { width: 15px; height: 15px; }
.hb .h-set svg { width: 17px; height: 17px; }
#isl[data-l="2"] .h-more svg, #isl[data-l="3"] .h-more svg { transform: rotate(180deg); }
#isl[data-l="3"] .h-full { display: none; }

/* 1 · peek: what plays, or Discord's latest */
.peek { top: 46px; bottom: 0; padding: 4px 18px 14px; }
.now { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.art { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #1a1a1e; box-shadow: 0 6px 18px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .06); cursor: pointer; transition: transform .3s var(--ease); }
.art:hover { transform: scale(1.04); }
.nt { min-width: 0; display: grid; gap: 2px; }
.nt b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nt span { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nbar { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.nbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, transparent, var(--acc)); box-shadow: 0 0 8px var(--acc); transition: width .5s linear; }
.ntime { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.ctl { display: grid; grid-template-columns: 1fr repeat(3, auto) 1fr; align-items: center; gap: 12px; margin-top: 9px; }
.ctl .c-prev { grid-column: 2; } .ctl .c-dev { justify-self: end; }
.ctl button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background .2s, transform .12s; }
.ctl button:hover { background: rgba(255, 255, 255, .1); }
.ctl button:active { transform: scale(.92); }
.ctl svg { width: 18px; height: 18px; fill: currentColor; }
.ctl .c-play { width: 42px; height: 42px; background: #f5f3ff; color: #000; }
.ctl .c-play:hover { background: #fff; }
.ctl .c-like.on { color: var(--acc); }
.ctl .c-like svg { fill: none; }
.ctl .c-like.on svg { fill: currentColor; }
.empty { display: grid; gap: 10px; justify-items: start; padding: 6px 2px; color: var(--ink2); }
.empty b { color: var(--ink); font-size: 14px; }
.empty-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.go { display: inline-flex; gap: 7px; align-items: center; padding: 8px 14px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 60%, transparent); background: color-mix(in srgb, var(--acc) 14%, transparent); }
.go:hover { background: color-mix(in srgb, var(--acc) 26%, transparent); }
.dcline { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 11.5px; margin-bottom: 8px; }
.dcline i { width: 7px; height: 7px; border-radius: 50%; background: #5a5870; flex: none; }
.dcline i.ok { background: var(--dc); box-shadow: 0 0 8px var(--dc); }

/* Discord messages (peek, expanded, the whole screen) */
.msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 6px 6px; border-radius: 10px; cursor: pointer; }
.msg:hover { background: rgba(255, 255, 255, .05); }
.msg img { width: 32px; height: 32px; border-radius: 50%; background: #2a2a3a; }
.msg .mh { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.msg .mh b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg .mh small { color: var(--ink2); font-size: 11px; white-space: nowrap; }
.msg p { margin: 1px 0 0; color: rgba(245, 243, 255, .85); word-wrap: break-word; white-space: pre-wrap; user-select: text; }
.peek .msg p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dcp { top: 46px; bottom: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding: 2px 14px 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { padding: 5px 11px; border-radius: 999px; font-size: 11.5px; color: var(--ink2); box-shadow: inset 0 0 0 1px var(--edge); }
.chips button[aria-pressed="true"] { color: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dc) 70%, transparent); background: color-mix(in srgb, var(--dc) 18%, transparent); }
.dcp .msgs { overflow-y: auto; scrollbar-width: thin; align-content: start; }
.dcfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink2); font-size: 11.5px; }
.dcfoot a, .dcfoot button { color: #aab0ff; text-decoration: none; font-weight: 700; }
#isl[data-l="3"] .dcp { top: 70px; width: min(980px, calc(100% - 64px)); margin: 0 auto; padding-bottom: 40px; }
#isl[data-l="3"] .head { height: 64px; width: min(980px, calc(100% - 64px)); margin: 0 auto; padding: 8px 0 0; }
#isl[data-l="3"] .msg { grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 10px; }
#isl[data-l="3"] .msg img { width: 44px; height: 44px; }
#isl[data-l="3"] .msg .mh b { font-size: 16px; }
#isl[data-l="3"] .msg p { font-size: 15px; }

/* 2 · the settings: grouped rows, like a phone's settings */
.setp { top: 46px; bottom: 0; }
.set-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 2px 16px 18px; }
.set-in { display: grid; gap: 16px; }
.set-scroll section { display: grid; gap: 7px; }
.set-scroll h3 { margin: 0 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.grp { border-radius: 14px; background: rgba(255, 255, 255, .045); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04); overflow: hidden; }
.grp > * + * { border-top: 1px solid rgba(255, 255, 255, .06); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 0 14px; box-sizing: border-box; text-align: left; font-size: 13px; }
.row > span:first-child { flex: 1; }
.sw { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 8px; justify-items: center; padding: 14px; }
.swc { position: relative; width: 22px; height: 22px; border-radius: 50%; background: var(--c); transition: transform .25s var(--ease); }
.swc:hover { transform: scale(1.12); }
.swc::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; box-shadow: 0 0 0 2px var(--c); opacity: 0; transform: scale(.8); transition: opacity .25s, transform .35s var(--ease); }
.swc[aria-pressed="true"]::after { opacity: .9; transform: none; }
.s-chip { position: relative; width: 22px; height: 22px; border-radius: 7px; background: var(--c); cursor: pointer; overflow: hidden; flex: none; }
.s-chip input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
.s-hex { flex: 1; font: 500 13px/1 "Chakra Petch", monospace; letter-spacing: .08em; color: var(--ink); background: none; border: 0; padding: 12px 0; text-transform: uppercase; user-select: text; }
.s-hex:focus { outline: none; }
.row output { min-width: 26px; text-align: right; color: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
.setp input[type=range] { -webkit-appearance: none; appearance: none; flex: 2; height: 3px; border-radius: 3px; margin: 0; cursor: pointer;
  background: linear-gradient(var(--acc), var(--acc)) 0 0 / calc(var(--v, 60) * 1%) 100% no-repeat, rgba(255, 255, 255, .14); }
.setp input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
/* a switch */
.row.stack { flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
.row.stack > span:first-child { flex-basis: 100%; }
.segs { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, .06); }
.segs button { padding: 5px 10px; border-radius: 7px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.segs button:hover { color: #fff; }
.segs button[aria-pressed="true"] { color: #fff; background: rgba(255, 255, 255, .15); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 45%, transparent); }
.s-keynote { flex-basis: 100%; color: var(--ink2); font-size: 11.5px; }
.s-keynote:empty { display: none; }
.tg { position: relative; width: 36px; height: 21px; flex: none; border-radius: 11px; background: rgba(255, 255, 255, .16); transition: background .3s ease; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); transition: transform .35s var(--ease); }
[aria-checked="true"] > .tg { background: var(--acc); }
[aria-checked="true"] > .tg::after { transform: translateX(15px); }
.every { transition: opacity .3s; } .every.off { opacity: .4; pointer-events: none; }
.every input { width: 44px; font: 500 13px/1 "Chakra Petch", monospace; color: var(--ink); text-align: right; background: none; border: 0; padding: 4px 0; }
.every input:focus { outline: none; color: var(--acc); }
.every small { color: var(--ink2); font-size: 12px; }
.set-scroll .hint { margin: 0 4px; font-size: 11px; color: var(--ink2); }

/* the grab bar: drag down for more, up for less */
.grab { position: absolute; left: 50%; bottom: 4px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(255, 255, 255, .16); opacity: 0; transition: opacity .3s; cursor: ns-resize; }
#isl[data-l="1"] .grab, #isl[data-l="2"] .grab { opacity: 1; }

/* the player (Spotify / YouTube) inside the island when expanded: as it was, in the accent's colour */
html .np.in-app.mini-page { top: 52px !important; left: 50% !important; right: auto !important; width: 420px !important; opacity: 1 !important; transform: translateX(-50%) !important; z-index: 5; transition: none !important; }
html .np.in-app.mini-page.big.wide { width: 780px !important; }
html .np.in-app.mini-page.yt-full { transform: none !important; z-index: 20; }

  function msgRow(m, short) {
    var li = el('li', 'msg'), im = el('img'); im.alt = ''; im.loading = 'lazy'; if (m.author.avatar) im.src = m.author.avatar; im.onerror = function () { this.removeAttribute('src'); };
    var b = el('div'), h = el('div', 'mh'); h.appendChild(el('b', null, m.author.name)); h.appendChild(el('small', null, '#' + m.channelName + ' · ' + ago(m.ts)));
    b.appendChild(h); b.appendChild(el('p', null, m.content || '')); li.appendChild(im); li.appendChild(b);
    li.title = 'Open in Discord'; li.addEventListener('click', function () { window.open(m.url, '_blank'); });
    return li;
  }
  function dcLine() {
    var l = el('div', 'dcline'), i = el('i'); if (dcStatus.ok) i.className = 'ok'; l.appendChild(i);
    var m = leading();
    l.appendChild(el('span', null, dcStatus.ok ? (m ? 'Showing “' + m.title + '” on your profile' : 'Connected: nothing playing to show') : (dcStatus.text || 'Rich Presence is off')));
    return l;
  }
  function paintPeekDiscord(p) {
    if (!dcSetUp()) { p.appendChild(emptyBox('Discord is not set up yet', 'Show what you play on your profile, and see the latest messages from your servers.', 'Set up Discord ' + IC.ext, function () { guide('discord'); })); return; }
    p.appendChild(dcLine());
    var ul = el('ul', 'msgs');
    if (!feed.configured) p.appendChild(emptyBox('', 'Add a bot in the guide to see messages here.', 'Add messages ' + IC.ext, function () { guide('discord'); }));
    else if (feed.error && !feed.messages.length) p.appendChild(emptyBox('', feed.error, 'Fix it in the guide ' + IC.ext, function () { guide('discord'); }));
    else if (!feed.messages.length) p.appendChild(el('div', 'empty', feed.channels.length ? 'No messages yet.' : 'Pick channels to follow in the guide.'));
    else { feed.messages.slice(0, 2).forEach(function (m) { ul.appendChild(msgRow(m, true)); }); p.appendChild(ul); }
    markSeen();
  }

  /* ---------- 2 / 3 · Discord's channels ---------- */
  function paintDiscord() {
    var chips = $('.dcp .chips'), ul = $('.dcp .msgs'); chips.textContent = ''; ul.textContent = '';
    [{ id: 'all', name: 'All' }].concat(feed.channels.map(function (c) { return { id: c.id, name: '#' + c.name }; })).forEach(function (c) {
      var b = el('button', null, c.name); b.type = 'button'; b.setAttribute('aria-pressed', String(dcChan === c.id)); b.addEventListener('click', function () { dcChan = c.id; paintDiscord(); }); chips.appendChild(b);
    });
    if (!dcSetUp() || !feed.configured) { ul.appendChild(emptyBox(dcSetUp() ? 'No messages yet' : 'Discord is not set up yet', 'A bot of yours, added to your server, brings in the latest messages from the channels you pick.', 'Open the guide ' + IC.ext, function () { guide('discord'); })); }
    else {
      var ms = feed.messages.filter(function (m) { return dcChan === 'all' || m.channel === dcChan; });
      if (!ms.length) ul.appendChild(el('div', 'empty', feed.error || 'Nothing here yet.'));
      ms.forEach(function (m) { ul.appendChild(msgRow(m)); });
    }
    $('.dcst').textContent = (dcStatus.ok ? '● ' : '○ ') + (dcStatus.text || 'Rich Presence is off') + (feed.bot ? ' · bot: ' + feed.bot : '');
    markSeen();
  }
  $('.dc-refresh').addEventListener('click', function () { if (D) D.discord.refresh(); });
  $('.dc-setup').addEventListener('click', function () { guide('discord'); });
  function markSeen() {
    if (tab !== 'dc' || level === 0 || !feed.messages.length) return;
    var top = feed.messages[0].ts; if (top > seen) { seen = top; try { localStorage.setItem('ia-dc-seen', String(seen)); } catch (e) { } paintPill(); }
  }

  /* ---------- the levels, and the island's size ---------- */
  var HEAD = 46, setOpen = false, curW = 0, curH = 0, shrinkT = 0;
  function target() {
    if (level === 0) return [pillWidth(), 36, 18];
    if (level === 1) return [tab === 'dc' ? 460 : 440, tab === 'dc' ? 214 : 186, 30];
    if (level === 2 && setOpen) return [460, Math.min(window.screen.availHeight - 30, HEAD + $('.set-in').offsetHeight + 24), 28];
    if (level === 2 && tab !== 'dc') { var r = document.querySelector('.np').getBoundingClientRect(); return [Math.max(440, Math.round(r.width) + 20), Math.round(HEAD + r.height + 14), 28]; }
    if (level === 2) return [480, Math.min(620, HEAD + 70 + Math.max(160, Math.min(9, feed.messages.length || 3) * 56)), 28];
    return [window.innerWidth, window.innerHeight, 0];
  }
  var ov = null;   // the overlay: where main.js put the pill in the window (and the screen's sides); null: the window follows the island's size
  // the overlay window's height (main.js says, as the page may hear it before the window has its size again)
  function winH() { return ov && ov.height > 0 ? ov.height : innerHeight; }
  function placeVars(w, h) {
    var st = document.documentElement.style;
    var left = Math.round(Math.max(ov.left + 6, Math.min(ov.right - w - 6, ov.cx - w / 2)));   // whole on its screen, near a side too
    var top = ov.up ? Math.round(winH() - ov.bottom - h) : ov.top;                         // grows away from the edge it sits on
    st.setProperty('--ix', left + 'px'); st.setProperty('--iy', top + 'px');
  }
  function size() {
    if (level === 3) return;
    var t = target(), s = document.documentElement.style;
    if (ov) {   // no taller than the room it has in the window, no wider than its screen
      t[1] = Math.min(t[1], (ov.up ? winH() - ov.bottom : winH() - ov.top) - 10);
      t[0] = Math.min(t[0], ov.right - ov.left - 12);
    }
    s.setProperty('--w', t[0] + 'px'); s.setProperty('--h', t[1] + 'px'); s.setProperty('--r', t[2] + 'px');
    // the contents are laid out once at the final width (the pill's and the open island's separately), so while the shape
    // grows or shrinks around them nothing re-wraps; the shape simply reveals them
    s.setProperty(level === 0 ? '--pw' : '--cw', t[0] + 'px');
    clearTimeout(shrinkT);
    if (ov && ov.drag) { /* being carried: main.js put it at the top left of a window its size */ }
    else if (ov) placeVars(t[0], t[1]);
    else if (D) {
      var ww = t[0] + 44, wh = t[1] + 30;
      if (ww >= curW && wh >= curH) { D.island.size(ww, wh); curW = ww; curH = wh; }
      else {
        curW = Math.max(ww, curW); curH = Math.max(wh, curH); D.island.size(curW, curH);
        shrinkT = setTimeout(function () { D.island.size(ww, wh); curW = ww; curH = wh; }, 275);
      }
    }
    if (level === 0) setTimeout(marquee, 280);
  }
  function render() {
    setOpen = level === 2 && panel === 'set';
    isl.dataset.l = String(level); isl.dataset.tab = tab;
    if (D && D.island.state) D.island.state(level);
    $$('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.t === tab)); });
    var more = $('.h-more'), moreLabel = level >= 2 ? 'Show less' : 'Expand';
    more.setAttribute('aria-expanded', String(level >= 2)); more.setAttribute('aria-label', moreLabel); more.title = moreLabel;
    $('.h-set').setAttribute('aria-pressed', String(setOpen));
    $('.pill').classList.toggle('on', level === 0);
    $('.head').classList.toggle('on', level >= 1);
    $('.peek').classList.toggle('on', level === 1);
    $('.dcp').classList.toggle('on', level >= 2 && tab === 'dc' && !setOpen);
    $('.setp').classList.toggle('on', setOpen);
    var np = level === 2 && tab !== 'dc' && !setOpen;
    body.classList.toggle('show-np', np);
    tint(); live();
    api.setPanelActive(level > 0 && tab === 'sp' && !setOpen);
    if (np) { api.setSource(tab); api.setBig(true); }
    if (level === 1) paintPeek();
    if (level >= 2 && tab === 'dc') paintDiscord();
    size();
    if (np) requestAnimationFrame(function () { requestAnimationFrame(size); });
  }
  function go(l) {
    l = Math.max(0, Math.min(3, l));
    if (l === 3) {
      if (tab === 'dc') { level = 3; clearTimeout(shrinkT); if (D) D.island.full(true); render(); setTimeout(paintDiscord, 50); return; }
      var t = music[SRC[tab]];
      api.setSource(tab); api.openView(tab === 'yt' ? 'yt' : (t ? 'now' : 'dj'));   // the player's full view (DJ mode if nothing plays)
      return;
    }
    if (level === 3) { if (api.view()) { api.closeView(); return; } if (D) D.island.full(false); }
    if (l > 0 && level === 0 && !music[SRC[tab]] && tab !== 'dc') { var k = isl.dataset.kind; if (k === 'sp' || k === 'yt' || k === 'dc') tab = k; }
    if (l < 2) panel = null;
    level = l; render();
  }
  // the player's full view (and DJ mode) takes the whole screen
  var viewClosed = 0, fullChange = 0, fullView = null;
  window.addEventListener('np:view', function (e) {
    var v = e.detail && e.detail.view, change = ++fullChange;
    if (v) {
      fullView = v;
      level = 3;
      clearTimeout(hoverT); clearTimeout(leaveT); clearTimeout(shrinkT);
      function failed() { if (change === fullChange) api.closeView(); }
      function show(bounds, deadline) {
        if (change !== fullChange) return;
        if (bounds && (window.innerWidth + 2 < bounds.width || window.innerHeight + 2 < bounds.height)) {
          if (performance.now() >= deadline) { failed(); return; }
          requestAnimationFrame(function () { show(bounds, deadline); });
          return;
        }
        body.classList.add('np-full'); render();
      }
      if (D) D.island.full(true).then(function (bounds) { if (bounds) show(bounds, performance.now() + 2500); else failed(); }, failed);
      else show();
    } else if (level === 3 || body.classList.contains('np-full')) {
      body.classList.remove('np-full'); viewClosed = Date.now();
      if (D) D.island.full(false);
      level = fullView === 'yt' && !(e.detail && e.detail.returnExpanded) ? 1 : 2;
      fullView = null; sticky = true; render();
    }
  });
  new ResizeObserver(function () { if (level === 2 && tab !== 'dc' && !setOpen) size(); }).observe(document.querySelector('.np'));
  new ResizeObserver(function () { if (setOpen) size(); }).observe($('.set-in'));

  /* ---------- opening and closing: hover, click, drag, the buttons, Esc, clicking elsewhere ---------- */
  var hoverT = 0, leaveT = 0, hoverOpened = false;
  function hoverIn() {
    clearTimeout(leaveT);
    clearTimeout(hoverT);
    if (level !== 0 || moving || Date.now() - dropped < 900) return;   // just let go of a drag: not a hover
    hoverT = setTimeout(function () {
      if (level !== 0 || moving || Date.now() - dropped < 900 || !isl.matches(':hover') || pillGrip.matches(':hover')) return;
      hoverOpened = true; sticky = false; go(1);
    }, 260);
  }
  isl.addEventListener('mouseenter', hoverIn);
  function hoverOut() {
    clearTimeout(hoverT);
    if (level !== 1 || !hoverOpened || sticky) return;
    clearTimeout(leaveT);
    leaveT = setTimeout(function () { if (level === 1 && hoverOpened && !sticky && !isl.matches(':hover')) go(0); }, 650);
  }
  isl.addEventListener('mouseleave', hoverOut);
  document.documentElement.addEventListener('mouseleave', hoverOut);

  /* ---------- moving it: the grip, and arriving on another screen ---------- */
  // pressing a grip (in the pill, or beside the close button) moves the window with the mouse (main.js); letting go leaves
  // the island there, on that screen (near an edge or the middle it snaps to it). The grip is part of the island, so the
  // press is always the island's.
  var moving = false;
  $$('.grip').forEach(function (g) {
    g.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || !D || !D.island.drag) return;
      e.preventDefault(); e.stopPropagation(); g.setPointerCapture(e.pointerId);
      moving = true; body.classList.add('moving'); clearTimeout(hoverT); clearTimeout(leaveT);
      var r = isl.getBoundingClientRect();
      D.island.drag('start', { x: r.left, y: r.top, w: r.width, h: r.height });
    });
    g.addEventListener('pointerup', drop);
    g.addEventListener('lostpointercapture', drop);
    g.addEventListener('click', function (e) { e.stopPropagation(); });   // not a click on the pill (which opens it)
  });
  // resting on the pill's grip does not open the island (it would move the grip away); moving on into the pill does
  var pillGrip = $('.pill .grip');
  pillGrip.addEventListener('mouseenter', function () { clearTimeout(hoverT); });
  pillGrip.addEventListener('mouseleave', function (e) { if (isl.contains(e.relatedTarget)) hoverIn(); });
  var dropped = 0;
  function drop() { if (!moving) return; moving = false; dropped = Date.now(); clearTimeout(hoverT); body.classList.remove('moving'); D.island.drag('end'); }
  Astrum.theme.onChange(function () { live(); });
  // where it was put: in the bottom half of a screen it opens upwards (main.js says)
  var up = false;
  if (D && D.island.onPlace) D.island.onPlace(function (p) {
    if (p && p.drag) {   // carried: the window shrank around the island, which sits at its top left until the drop
      if (!ov) return;
      ov = Object.assign({}, ov, { drag: true }); body.classList.add('noanim');
      var st = document.documentElement.style; st.setProperty('--ix', p.x + 'px'); st.setProperty('--iy', p.y + 'px');
      return;
    }
    up = !!(p && p.up);
    if (p && p.overlay) {   // moved (or first placed): straight to the new spot, no slide inside the window
      ov = p; body.classList.add('ov', 'noanim'); body.classList.remove('up');
      body.classList.toggle('notch', !!p.notch); document.documentElement.style.setProperty('--bar', (p.bar || 24) + 'px');
      size();
      requestAnimationFrame(function () { requestAnimationFrame(function () { body.classList.remove('noanim'); }); });
    } else { ov = null; body.classList.remove('ov'); body.classList.toggle('up', up); }
  });
  // the overlay lets clicks through wherever the mouse is not on the island (or the player, or a menu)
  var through = null;
  function clickThrough(v) { if (!ov || !D || !D.island.ignore || v === through) return; through = v; D.island.ignore(v); }
  document.addEventListener('mousemove', function (e) {
    if (!ov) return;
    if (level === 3 || moving) { clickThrough(false); return; }
    clickThrough(e.target === document.documentElement || e.target === body);
  }, { passive: true });
  document.documentElement.addEventListener('mouseleave', function () { if (level !== 3 && !moving) clickThrough(true); });
  // the shortcut (Ctrl+Shift+Space / ⌘⇧Space): closed, it opens and takes the keyboard; open, it closes to the pill
  if (D && D.island.onSummon) D.island.onSummon(function () {
    if (level === 0) { sticky = true; hoverOpened = false; D.island.focus(); go(1); }
    else if (level < 3) { sticky = false; go(0); }
  });
  /* Position: where it stays, on top of other apps or not, the shortcut (kept by the app: main.js) */
  function paintPosition(st) {
    if (!st) return;
    $$('.s-place button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === (st.placement || 'spot'))); });
    $('.s-place [data-v="notch"]').hidden = !st.notchOk;   // a Mac's
    $('.s-top').setAttribute('aria-checked', String(st.alwaysOnTop !== false));
    var keys = $('.s-key'), opts = st.mac ? [['CommandOrControl+Shift+Space', '⌘⇧Space'], ['Alt+Space', '⌥Space'], ['', 'Off']] : [['CommandOrControl+Shift+Space', 'Ctrl+Shift+Space'], ['Alt+Space', 'Alt+Space'], ['', 'Off']];
    if (!keys.childNodes.length) opts.forEach(function (o) {
      var b = el('button', null, o[1]); b.type = 'button'; b.dataset.v = o[0];
      b.addEventListener('click', function () { D.settings.set({ shortcut: o[0] }).then(paintPosition); });
      keys.appendChild(b);
    });
    $$('.s-key button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === (st.shortcut || ''))); });
    $('.s-keynote').textContent = st.shortcut && st.shortcutOk === false ? 'Another app already uses this shortcut: pick another.' : st.shortcut ? 'Press it anywhere to open Astrum; again to close it.' : '';
  }
  if (D && D.settings.set) {
    $$('.s-place button').forEach(function (b) { b.addEventListener('click', function () { D.settings.set({ placement: b.dataset.v }).then(paintPosition); }); });
    $('.s-top').addEventListener('click', function () { D.settings.set({ alwaysOnTop: this.getAttribute('aria-checked') !== 'true' }).then(paintPosition); });
    D.settings.get().then(paintPosition); D.settings.onChange(paintPosition);
  }
  $('.pill').addEventListener('click', function () { clearTimeout(hoverT); sticky = true; hoverOpened = false; if (D) D.island.focus(); go(1); });
  $$('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { sticky = true; tab = b.dataset.t; panel = null; if (level === 3) { go(2); } render(); });
  });
  $('.h-set').addEventListener('click', function () {
    sticky = true;
    if (panel === 'set' && level === 2) { panel = null; render(); return; }
    panel = 'set';
    if (level === 3) go(2); else { level = 2; render(); }
  });
  $('.h-more').addEventListener('click', function () { sticky = true; go(level >= 2 ? 1 : 2); });
  $('.h-full').addEventListener('click', function () { go(3); });
  $('.h-up').addEventListener('click', function () { sticky = false; go(0); });
  // drag: away from the edge it sits on for more (down, or up when at the bottom), back for less (the pill, the head, the grab bar)
  var dragY = null;
  function dragStart(e) { if (e.button !== 0 || e.target.closest('button') && !e.target.closest('.pill')) return; dragY = e.clientY; }
  [$('.pill'), $('.head'), $('.grab')].forEach(function (n) { n.addEventListener('pointerdown', dragStart); });
  window.addEventListener('pointermove', function (e) {
    if (dragY == null) return; var dy = (up ? -1 : 1) * (e.clientY - dragY);   // at the bottom of a screen, up opens it
    if (dy > 26 && level < 2) { dragY = e.clientY; sticky = true; clearTimeout(hoverT); go(level + 1); }
    else if (dy < -26 && level > 0 && level < 3) { dragY = e.clientY; go(level - 1); }
  });
  window.addEventListener('pointerup', function () { dragY = null; });
  window.addEventListener('pointercancel', function () { dragY = null; });
  window.addEventListener('wheel', function (e) { if (level === 0 && e.deltaY > 20) { sticky = true; go(1); } }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || document.querySelector('.np-pick.on') || Date.now() - viewClosed < 100) return;
    if (level === 3 && tab === 'dc') go(2); else if (level > 0 && level < 3) go(level - 1);
  });
  window.addEventListener('blur', function () { setTimeout(function () {
    if (level > 0 && level < 3 && !setOpen && !document.hasFocus() && !isl.matches(':hover')) { sticky = false; go(0); }
  }, 180); });

  /* ---------- the app: settings, Discord ---------- */
  if (D) {
    D.settings.get().then(function (s) { settings = s || {}; paintPill(); });
    D.settings.onChange(function (s) { settings = s || {}; paintPill(); if (level === 1) paintPeek(); });
    D.discord.status().then(function (s) { dcStatus = s || dcStatus; });
    D.discord.onStatus(function (s) { dcStatus = s || dcStatus; if (tab === 'dc' && level >= 1) (level === 1 ? paintPeek : paintDiscord)(); });
    D.discord.feed().then(function (f) { if (f) { feed = f; paintPill(); } });
    D.discord.onFeed(function (f) { feed = f || feed; paintPill(); if (tab === 'dc') { if (level === 1) paintPeek(); else if (level >= 2) { paintDiscord(); size(); } } });
    D.island.onReflow(function () { curW = curH = 0; size(); });
    D.island.onPoke(function () { sticky = true; go(level === 0 ? 1 : level); });
    D.kv.onChange(function (d) { if (d.key === 'np-spotify-v1' || d.key === 'yt-library-v1') { paintPill(); if (level === 1) paintPeek(); } });
  }
  paintPill(); render();
})();
</script>
