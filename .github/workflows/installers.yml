name: Desktop installers

# Builds, installs and starts Astrum on Windows and both kinds of Mac.
#   pull requests       build and test only
#   a push to main      also refreshes the "Latest build" pre-release (direct downloads of the newest main)
#   a tag like v1.1.0   publishes that version as a release (the tag must match package.json: `npm version minor`)
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/installers.yml, 'deploy/**', 'app/**', 'lib/**', 'build/**', main.js, preload.js, package.json, package-lock.json]
  push:
    branches: [main]
    tags: ['v*']   # (GitHub does not apply path filters to tag pushes: a version tag always builds)
    paths: [.github/workflows/installers.yml, 'deploy/**', 'app/**', 'lib/**', 'build/**', main.js, preload.js, package.json, package-lock.json]

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  website:
    name: Dokploy site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check public guides and installer download
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile -t astrum-site .
          docker run --rm --entrypoint /bin/sh astrum-site -c 'test -r /srv/astrum-artifacts/download/windows'
          docker run --rm astrum-site nginx -t
          docker run -d --name astrum-site -p 127.0.0.1:8080:8080 astrum-site
          trap 'docker logs astrum-site >&2; docker rm -f astrum-site >/dev/null' EXIT
          base=http://127.0.0.1:8080
          curl -fsS --retry 8 --retry-all-errors --retry-delay 1 "$base/" > "$RUNNER_TEMP/astrum-home.html"
          curl -fsS "$base/setup.html" > "$RUNNER_TEMP/astrum-setup.html"
          for service in spotify youtube discord; do
            grep -F "setup.html#$service" "$RUNNER_TEMP/astrum-home.html"
            grep -F "id=\"$service\"" "$RUNNER_TEMP/astrum-setup.html"
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/status")" = 404
          curl -fsSI "$base/download/windows" | grep -i '^content-type: application/octet-stream'
          test "$(curl -fsS -r 0-1023 -o /dev/null -w '%{http_code}' "$base/download/windows")" = 206
          expected=$(sed -n 's/^ARG ASTRUM_WINDOWS_SHA256=//p' deploy/Dockerfile)
          curl -fsS "$base/download/windows" | sha256sum | grep -F "$expected"

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: A version tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json; use npm version"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build, install, and start Astrum
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (!$env:WIN_CSC_LINK) { Remove-Item Env:WIN_CSC_LINK, Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue }
          npx --no-install electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installer = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows installer was not built' }
          if ($env:WIN_CSC_LINK -and (Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') {
            throw 'Windows installer signature is invalid'
          }
          $target = Join-Path $env:RUNNER_TEMP 'astrum-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($install.ExitCode) { throw "Installer exited with $($install.ExitCode)" }
          $app = Start-Process -FilePath (Join-Path $target 'Astrum.exe') -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($app.HasExited) { throw 'Astrum exited during launch' }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:43210/api/status' -TimeoutSec 2
                if ($null -ne $status.spotify -and $null -ne $status.app) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw 'Astrum did not start its local setup server' }
          } finally {
            Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Astrum-Windows-x64
          path: dist/*Setup*.exe
          if-no-files-found: error

  mac:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Build, mount, and start Astrum
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CSC_LINK" ]]; then
            : "${APPLE_API_KEY_B64:?Missing Apple notarization key}" "${APPLE_API_KEY_ID:?Missing Apple key ID}" "${APPLE_API_ISSUER:?Missing Apple issuer}"
            umask 077
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_B64" | base64 -D > "$APPLE_API_KEY"
            args+=(-c.forceCodeSigning=true)
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            # ad-hoc signing (no certificate, nothing secret): electron-builder skips all signing on pull requests unless told,
            # and an unsigned app fails the signature check below
            export CSC_FOR_PULL_REQUEST=true
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npx --no-install electron-builder --mac dmg "--$ARCH" --publish never "${args[@]}"
          dmg=(dist/*.dmg)
          hdiutil verify "${dmg[0]}"
          mount="$RUNNER_TEMP/astrum-mounted"
          target="$RUNNER_TEMP/astrum-installed/Astrum.app"
          hdiutil attach "${dmg[0]}" -nobrowse -readonly -mountpoint "$mount"
          pid=
          trap 'if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; fi; hdiutil detach "$mount"' EXIT
          ditto "$mount/Astrum.app" "$target"
          codesign --verify --deep --strict "$target"
          if [[ -n "${CSC_LINK:-}" ]]; then
            spctl --assess --type execute "$target"
            xcrun stapler validate "$target"
          fi
          "$target/Contents/MacOS/Astrum" > "$RUNNER_TEMP/astrum.log" 2>&1 &
          pid=$!
          for ((i = 0; i < 30; i++)); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if status=$(curl -fsS --max-time 2 http://127.0.0.1:43210/api/status 2>/dev/null) &&
              printf '%s' "$status" | jq -e '.spotify and .app' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/astrum.log"
          exit 1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Astrum-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  # the downloads: "Latest build" for main, a versioned release for a tag (Windows installer, Mac DMGs for Apple silicon and Intel)
  release:
    name: Publish downloads
    needs: [windows, mac]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: built
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; v="${tag#v}"; suffix="-$v"; title="Astrum $v"; kind=(--latest)
          else
            tag=latest-build; suffix=""; title="Latest build (main, ${GITHUB_SHA::7})"; kind=(--prerelease)
          fi
          mkdir up
          cp built/Astrum-Windows-x64/*.exe "up/Astrum-Setup${suffix}.exe"
          cp built/Astrum-macOS-arm64/*.dmg "up/Astrum${suffix}-mac-Apple-silicon.dmg"
          cp built/Astrum-macOS-x64/*.dmg "up/Astrum${suffix}-mac-Intel.dmg"
          (cd up && sha256sum * > SHA256SUMS.txt)
          {
            echo "**Windows:** Astrum-Setup${suffix}.exe · **Mac:** the Apple silicon DMG for M1 and newer, the Intel DMG for older Macs."
            echo
            echo "These builds are not signed yet, so each system warns the first time:"
            echo "- **Windows:** SmartScreen says it protected your PC: press **More info**, then **Run anyway**."
            echo "- **Mac:** open the DMG and drag Astrum to Applications. The first time it is blocked: open **System Settings → Privacy & Security**, scroll down and press **Open Anyway** next to Astrum."
            echo
            echo "Built from ${GITHUB_SHA}."
            echo
            echo '```'
            cat up/SHA256SUMS.txt
            echo '```'
          } > notes.md
          if [[ "$tag" == latest-build ]]; then
            gh release delete latest-build --cleanup-tag --yes 2>/dev/null || true
          fi
          gh release create "$tag" up/* --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "${kind[@]}"
